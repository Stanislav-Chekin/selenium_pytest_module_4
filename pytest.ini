[pytest]
# Говорим PyTest, что по умолчанию мы ищем тесты только в папке selenium_tests
# (Чтобы он случайно не начал запускать примеры учителя из lesson_materials)
pythonpath = .
testpaths = selenium_tests/tests

# Настройки вывода
addopts = -v -s --tb=short --alluredir=allure-results

# Регистрируем маркеры
markers =
    smoke: Быстрые тесты для проверки базовой работоспособности
    regression: Полный набор тестов
    negative: Тесты на негативные сценарии
